plugins {
	id 'java'
	id 'org.springframework.boot' version '2.7.13'
	id 'io.spring.dependency-management' version '1.1.7'
	// WAR 패키징을 위해 추가
	id 'war'
}

group = 'com.boot'
version = '0.0.1-SNAPSHOT'
description = 'Car_Repair_final'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
    imports {
        // Spring AI BOM을 사용하여 하위 AI 라이브러리 버전 관리
        mavenBom "org.springframework.ai:spring-ai-bom:1.0.0" 
    }
}

dependencies {
	// 기본 웹 및 JSP 관련
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.apache.tomcat.embed:tomcat-embed-jasper'
	implementation 'javax.servlet:jstl:1.2'

	// MyBatis
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:2.3.1'

	// Oracle
	runtimeOnly 'com.oracle.database.jdbc:ojdbc11'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	//Google AI
	implementation 'org.springframework.ai:spring-ai-core'
	implementation 'org.springframework.ai:spring-ai-google-gemini'

	// 개발용 (자동 리빌드 등)
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// 테스트 관련
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.5'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	
	// 이메일 전송 관련 (javax.mail 로 유지)
    implementation 'org.springframework.boot:spring-boot-starter-mail:2.7.13'
    implementation 'com.sun.mail:javax.mail:1.6.2'

}

tasks.named('test') {
	useJUnitPlatform()
}

bootJar {
	enabled = false
}

war {
	enabled = true
}
